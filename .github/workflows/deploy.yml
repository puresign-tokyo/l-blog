# https://github.com/actions/deploy-pages#usage
name: Deploy to GitHub Pages
on:
  workflow_dispatch:
  push:
    branches:
      - main
jobs:
  build:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm fetch --frozen-lockfile
      - run: pnpm install --offline --frozen-lockfile
      - name: Block outbound network for build
        run: |
          sudo iptables-save > /tmp/iptables.rules
          sudo ip6tables-save > /tmp/ip6tables.rules
          sudo iptables -A OUTPUT -o lo -j ACCEPT
          sudo ip6tables -A OUTPUT -o lo -j ACCEPT
          sudo iptables -P OUTPUT DROP
          sudo ip6tables -P OUTPUT DROP
      - run: pnpm exec nuxt build --preset github_pages
      - name: Restore outbound network
        if: always()
        run: |
          sudo iptables-restore < /tmp/iptables.rules
          sudo ip6tables-restore < /tmp/ip6tables.rules
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./.output/public
  # Deployment job
  deploy:
    # Add a dependency to the build job
    needs: build
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    # Deploy to the github_pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Specify runner + deployment step
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
